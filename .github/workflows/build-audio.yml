name: Build episode audio

on:
  push:
    branches: [main]
    paths: ["docs/episodes/**/script.json"]
  workflow_dispatch:
    inputs:
      date:
        description: "Episode date (YYYY-MM-DD); empty = every episode without audio"
        required: false

permissions:
  contents: write

concurrency:
  group: build-audio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Synthesize missing / changed episodes
        run: |
          set -e
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python pipeline/build_episode.py "${{ github.event.inputs.date }}"
            exit 0
          fi
          for d in docs/episodes/*/; do
            date=$(basename "$d")
            [ -f "$d/script.json" ] || continue
            if [ ! -f "$d/audio.mp3" ] || [ "$d/script.json" -nt "$d/audio.mp3" ] || \
               git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "episodes/$date/script.json"; then
              python pipeline/build_episode.py "$date"
            fi
          done
      - name: Commit audio
        run: |
          git config user.name "reggeli-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/episodes
          git diff --cached --quiet || git commit -m "audio: build episode $(date -u +%F)"
          git push
